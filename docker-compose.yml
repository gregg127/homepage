---
version: "3.8"
services:
  homepage:
    container_name: gatsby_page
    build:
      context: .
      dockerfile: Dockerfile
    ports: [8000:80]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 2s
      retries: 15

  playwright:
    build:
      context: tests
      dockerfile: playwright/Dockerfile
    platform: linux/amd64
    profiles: [test]
    entrypoint: [/app/node_modules/.bin/playwright]
    depends_on:
      homepage:
        condition: service_healthy
    volumes:
      - ./tests/playwright/screenshots:/app/tests/playwright/screenshots
      - ./test-results:/app/test-results
    environment:
      HOME: /tmp
      CI: ${CI:-}
    ipc: host
    init: true
