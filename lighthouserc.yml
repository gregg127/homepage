ci:
  collect:
    url:
      - https://golebiowski.dev/
      - https://golebiowski.dev/about/
      - https://golebiowski.dev/resume/
      - https://golebiowski.dev/contact/
    numberOfRuns: 3  # Run each test 3 times for more reliable results
    settings:
      # Standard Chrome Lighthouse settings
      preset: desktop
      onlyCategories:
        - performance
        - accessibility
        - best-practices
        - seo
  
  # assert:
    # assertions:
      # Set minimum score thresholds (0-1)
      # 'categories:performance': ['error', {minScore: 0.9}]
      # 'categories:accessibility': ['error', {minScore: 0.9}]
      # 'categories:best-practices': ['error', {minScore: 0.9}]
      # 'categories:seo': ['error', {minScore: 0.9}]
      
  upload:
    target: temporary-public-storage  # Upload results to Lighthouse's free storage service
