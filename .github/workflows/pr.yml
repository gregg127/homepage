---
name: Pull request tests
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '25'
      - name: Create placeholder for CV PDF (compiled when building Docker image)
        run: touch static/Grzegorz-Golebiowski-Java-Tech-Lead-CV.pdf
      - run: npm ci
      - run: npm run test # cleans and builds the site, then runs the suites and Playwright screenshot tests
